name: Publish source snapshot
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace repo root with source snapshot
        run: |
          curl -fL https://amiable-shrimp-189.convex.site/source-zip -o /tmp/s.zip
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          unzip -o /tmp/s.zip -d /tmp/src
          cp -a /tmp/src/. .
          ls package.json
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish launch-ready source snapshot" || echo "nothing to commit"
          git push origin main
